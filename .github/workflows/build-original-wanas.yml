name: Build Wanas 3.1 Room Audio Fix

on:
  push:
    branches: [wanas-original-v3.1-audio-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare source project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="Wanas-3.1-RoomAudio-Fix-source-v5-build-config.zip"
          if [[ -f "$ARCHIVE" ]]; then
            mkdir -p /tmp/wanas-source
            unzip -q "$ARCHIVE" -d /tmp/wanas-source
            cp -a /tmp/wanas-source/. .
          else
            echo "Missing $ARCHIVE."
            echo "Upload the full source ZIP to the repository root on branch wanas-original-v3.1-audio-build, then commit."
            exit 1
          fi
          test -s app/src/main/java/com/example/voice/RoomAudioEngine.kt
          test -s app/build.gradle.kts
          echo "Source project files verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-3.1-room-audio-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
