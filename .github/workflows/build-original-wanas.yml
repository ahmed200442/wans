name: Build Wanas 3.1 Room Audio Fix

on:
  push:
    branches: [wanas-original-v3.1-audio-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transfer files
        uses: actions/checkout@v4

      - name: Reassemble and verify patched source
        shell: bash
        run: |
          set -euo pipefail
          find source-parts -maxdepth 1 -name 'part*.b64' -type f -print | sort > /tmp/parts.txt
          echo "Parts available: $(wc -l < /tmp/parts.txt)"
          while IFS= read -r p; do echo "$p $(wc -c < "$p")"; done < /tmp/parts.txt
          while IFS= read -r p; do cat "$p"; done < /tmp/parts.txt > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.xz
          xz -t /tmp/source.tar.xz
          mkdir -p /tmp/source
          tar -xJf /tmp/source.tar.xz -C /tmp/source
          test -s /tmp/source/app/src/main/java/com/example/voice/RoomAudioEngine.kt
          rm -rf app gradle
          rm -f build.gradle.kts settings.gradle.kts gradle.properties
          cp -a /tmp/source/. .
          test -s app/src/main/java/com/example/voice/RoomAudioEngine.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          gradle --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wanas-3.1-room-audio-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
