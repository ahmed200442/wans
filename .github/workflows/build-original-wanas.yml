name: Build Wanas 3.1 Room Audio Fix

on:
  push:
    branches: [wanas-original-v3.1-audio-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source transfer
        uses: actions/checkout@v4

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat source-parts/part*.b64 > /tmp/source.b64
          echo "Encoded archive length: $(wc -c < /tmp/source.b64)"
          base64 --decode /tmp/source.b64 > /tmp/source.tar.xz
          xz -t /tmp/source.tar.xz
          mkdir -p /tmp/wanas-source
          tar -xJf /tmp/source.tar.xz -C /tmp/wanas-source
          test -s /tmp/wanas-source/app/src/main/java/com/example/voice/RoomAudioEngine.kt
          test -s /tmp/wanas-source/app/build.gradle.kts
          cp -a /tmp/wanas-source/. .
          echo "Source archive integrity and required files verified."

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build debug APK
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK output
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          test -s "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wanas-3.1-room-audio-fix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
